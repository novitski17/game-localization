services:
  db:
    image: postgres:15
    container_name: game-localization-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/GameLocalization
      dockerfile: Dockerfile
    container_name: game-localization-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__GameLocalizationDb: ${CONNECTION_STR}

      Auth__Jwt__SecretKey: ${JWT_SECRET}
      Auth__AdminSeed__Enabled: ${ADMIN_SEED_ENABLED}
      Auth__AdminSeed__Email: ${ADMIN_SEED_EMAIL}
      Auth__AdminSeed__Password: ${ADMIN_SEED_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  pgdata:
